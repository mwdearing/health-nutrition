[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "health-nutrition-catalog"
version = "0.0.1"
description = "Shared food and nutrient catalog service"
# CI verifies the catalog on Ubuntu Linux x86_64 with Python 3.12; the package floor is 3.12.
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "pydantic",
    "psycopg[binary]",
]

[project.optional-dependencies]
test = [
    "pytest",
    "httpx",
]

[tool.uv]
build-constraint-dependencies = [
    { requirement = "setuptools==84.0.0", hashes = [
        "sha256:51a52592b3b99e102b609654876bd65f19f999935166d1352678931132b0c670",
        "sha256:f4695c21257f0d9b537ec2692c941d02ee143b7cc1276941349a546573b2ef73",
    ] },
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs a PostgreSQL database reachable through DATABASE_URL (CI only)",
]
