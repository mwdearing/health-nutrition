[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "health-nutrition-catalog"
version = "0.0.1"
description = "Shared food and nutrient catalog service"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "pydantic",
    "psycopg[binary]",
]

[project.optional-dependencies]
test = [
    "pytest",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs a PostgreSQL database reachable through DATABASE_URL (CI only)",
]
