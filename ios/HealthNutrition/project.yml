name: HealthNutrition

options:
  bundleIdPrefix: dev.example
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
  groupSortPosition: top
  generateEmptyDirectories: false

packages:
  NutritionCore:
    path: ../NutritionCore
  # The human check of sign-in requests. The upstream 3.1.0 tag maps to this commit; the package's
  # RxSwift dependency is locked at its declared minimum but is not linked by this target.
  HCaptcha:
    url: https://github.com/hCaptcha/HCaptcha-ios-sdk
    revision: caea076bb9c4141c5d05c5009f894fede409342d

settings:
  base:
    SWIFT_VERSION: "5.0"
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # The app's bundle identifier. The widget extension's is this plus ".widgets" and the App Group is
    # "group." plus this, so the signed-beta and unsigned-ipa workflows set this one value, never
    # PRODUCT_BUNDLE_IDENTIFIER (which would give the extension the app's own identifier).
    APP_BUNDLE_ID: dev.example.HealthNutrition
    # The marketing version of the app and of its widget extension, one value so they cannot drift (App Store
    # Connect rejects an extension whose version differs from its app). The signed-beta workflow reads this line.
    MARKETING_VERSION: "0.1.30"

targets:
  HealthNutrition:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources
      - path: Resources
      # The snapshot the widgets read, compiled into the app and into the widget extension.
      - path: Shared
      # What the Watch app uses to apply a received summary, compiled into the app too so its tests run here.
      - path: WatchShared
    dependencies:
      - target: HealthNutritionWidgets
      # The Watch app (embedded with its own widget extension) that receives the summary this app sends.
      - target: HealthNutritionWatch
      - package: NutritionCore
        product: NutritionCore
      - package: NutritionCore
        product: NutritionUI
      - package: NutritionCore
        product: NutritionJournal
      # Barcode lookups in Add intake. The app target owns the network client and adapts it to the
      # lookup protocol the UI depends on; NutritionUI itself never links a networking framework.
      - package: NutritionCore
        product: NutritionProviders
      # The human check of the account sign-in. Only the app target links it.
      - package: HCaptcha
        product: HCaptcha
    # HealthKit capability. Nothing in the app reaches HealthKit except the writer
    # (Sources/HealthKitSampleWriter.swift), its driver (Sources/HealthKitDeliveryStatus.swift), which
    # asks for write access only when the person taps Connect Apple Health in Settings, and the debug
    # spike under Sources/Debug.
    entitlements:
      path: HealthNutrition.entitlements
      # XcodeGen rewrites the file from these properties during generation.
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.developer.healthkit: true
        com.apple.security.application-groups: ["group.$(APP_BUNDLE_ID)"]
    # The Info.plist keys the account settings read. Their values are the build settings above, so the
    # repository never holds a project address or key.
    info:
      path: Support/Info.plist
      properties:
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_ANON_KEY: "$(SUPABASE_ANON_KEY)"
        HCAPTCHA_SITE_KEY: "$(HCAPTCHA_SITE_KEY)"
        USDA_FDC_API_KEY: "$(USDA_FDC_API_KEY)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_ID)"
        PRODUCT_NAME: HealthNutrition
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: HealthNutrition
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Only the system's TLS and data protection: exempt encryption, declared so an uploaded build
        # does not wait on the compliance question before it reaches testers.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        # The app requests write access only. The read string stays because the debug HealthKit spike reads
        # back its own test samples; no release code path reads Health.
        INFOPLIST_KEY_NSHealthShareUsageDescription: "If you tap Show steps, activity and weight on Today, HealthNutrition reads your steps, active energy and weight to show them there. When you connect Apple Health, it also reads the nutrients and water other apps logged to Health, so your totals match Health. Nothing else is read except the samples it wrote, which it looks up to update or remove them when you edit or delete an entry, and a debug build's HealthKit test screen reads back the test water and protein samples it wrote."
        # Write access is asked for when you tap Connect Apple Health in Settings. The delivery driver then
        # writes the nutrients of the entries you log, and removes them again when you delete an entry.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "When you connect Apple Health, HealthNutrition writes the nutrients and water of the entries you log to Health, and removes them again when you delete an entry."
        # The camera in Add intake. It is used for two things and nothing else: reading the barcode
        # printed on a package, and reading the text of a Nutrition Facts panel so the values can be
        # checked before they are filled in. Text recognition runs on the device; the picture is never
        # stored and never sent anywhere.
        INFOPLIST_KEY_NSCameraUsageDescription: "Add intake can scan the barcode on a package to fill in the barcode field, and can read the text of a Nutrition Facts panel so you can check the values before they are filled in. The camera is only used for those two things, and for a rare camera check when you ask for an emailed sign-in code. Everything the app reads is read on this device, and no image is stored or sent by this app."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # No DEVELOPMENT_TEAM here: set your own team in Xcode, never commit it.
        SWIFT_EMIT_LOC_STRINGS: YES
        # The project address and public key of the account settings. Empty here, so a build without them shows
        # no account UI. The signed-beta workflow passes them on the command line from environment secrets.
        SUPABASE_URL: ""
        SUPABASE_ANON_KEY: ""
        # The challenge site key of the sign-in requests. Empty here, so a build without it sends no challenge token.
        HCAPTCHA_SITE_KEY: ""

  # The Today widgets (Lock Screen and home screen). They read only the summary the app writes into the App
  # Group (Shared/WidgetSnapshot.swift); they link no package and open nothing but the app.
  HealthNutritionWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Widgets
        excludes:
          - Info.plist
          - HealthNutritionWidgets.entitlements
      - path: Shared
    entitlements:
      path: Widgets/HealthNutritionWidgets.entitlements
      properties:
        com.apple.security.application-groups: ["group.$(APP_BUNDLE_ID)"]
    settings:
      base:
        # The extension point is declared in Widgets/Info.plist; the rest of the Info.plist is generated.
        INFOPLIST_FILE: Widgets/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_ID).widgets"
        PRODUCT_NAME: HealthNutritionWidgets
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Today
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  # The Watch app: receives the Today summary the phone sends and shows it. No feature of its own.
  HealthNutritionWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: Watch
        excludes:
          - Info.plist
          - HealthNutritionWatch.entitlements
      - path: Shared
      - path: WatchShared
    dependencies:
      - target: HealthNutritionWatchWidgets
    entitlements:
      path: Watch/HealthNutritionWatch.entitlements
      properties:
        com.apple.security.application-groups: ["group.$(APP_BUNDLE_ID)"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_ID).watchkitapp"
        PRODUCT_NAME: HealthNutritionWatch
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: HealthNutrition
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: "$(APP_BUNDLE_ID)"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES

  # The Watch widgets (complications and Smart Stack). Like the phone widgets they read only the stored summary.
  HealthNutritionWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchWidgets
        excludes:
          - Info.plist
          - HealthNutritionWatchWidgets.entitlements
      - path: Shared
    entitlements:
      path: WatchWidgets/HealthNutritionWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: ["group.$(APP_BUNDLE_ID)"]
    settings:
      base:
        INFOPLIST_FILE: WatchWidgets/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_ID).watchkitapp.widgets"
        PRODUCT_NAME: HealthNutritionWatchWidgets
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Today
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  # Unit tests for the app target itself. They depend on the app so the bundle is hosted by it, which
  # is what lets them read the app's own types through @testable and run against a real UIKit runtime.
  HealthNutritionTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests
        excludes:
          - PrivacyShieldUITests/**
          - AddSearchUITests/**
    dependencies:
      - target: HealthNutrition
      # The stores, the Connections view model and the recipe types the assertions use are the
      # package's, so the test bundle links them directly rather than relying on the app target's own
      # links.
      - package: NutritionCore
        product: NutritionJournal
      - package: NutritionCore
        product: NutritionDomain
      - package: NutritionCore
        product: NutritionUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.example.HealthNutritionTests
        GENERATE_INFOPLIST_FILE: YES

  HealthNutritionAddUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/AddSearchUITests
    dependencies:
      - target: HealthNutrition
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.example.HealthNutritionAddUITests
        GENERATE_INFOPLIST_FILE: YES

  HealthNutritionPrivacyUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/PrivacyShieldUITests
    dependencies:
      - target: HealthNutrition
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.example.HealthNutritionPrivacyUITests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  HealthNutrition:
    build:
      targets:
        HealthNutrition: all
        HealthNutritionWidgets: all
        HealthNutritionTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HealthNutritionTests
    archive:
      config: Release

  HealthNutritionAdd:
    build:
      targets:
        HealthNutrition: all
        HealthNutritionAddUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HealthNutritionAddUITests

  HealthNutritionPrivacy:
    build:
      targets:
        HealthNutrition: all
        HealthNutritionPrivacyUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HealthNutritionPrivacyUITests
