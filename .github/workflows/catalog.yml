name: catalog

on:
  pull_request:
    paths:
      - "catalog/**"
      - "contracts/**"
      - "docs/python-ci.md"
      - "docs/README.md"
      - "scripts/tests/test_dependency_workflow_locks.py"
      - "supabase/tests/run.sh"
      - ".github/workflows/catalog.yml"
  push:
    branches: [main]
    paths:
      - "catalog/**"
      - "contracts/**"
      - "docs/python-ci.md"
      - "docs/README.md"
      - "scripts/tests/test_dependency_workflow_locks.py"
      - "supabase/tests/run.sh"
      - ".github/workflows/catalog.yml"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Keep catalog CI on PostgreSQL 16; this is the verified Docker Hub multi-platform index digest.
        image: docker.io/library/postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: catalog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d catalog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/catalog_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.12.19
          enable-cache: false
      - name: Check catalog lock
        working-directory: catalog
        run: uv lock --check
      - name: Install frozen catalog dependencies
        working-directory: catalog
        run: uv sync --frozen --extra test
      - name: Test
        working-directory: catalog
        run: uv run --frozen python -m pytest -q tests ../scripts/tests/test_dependency_workflow_locks.py

  pytest-macos-frozen:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.12.19
          enable-cache: false
      - name: Install hash-locked CI tools in a separate environment
        run: |
          python -m venv "$RUNNER_TEMP/ci-tools"
          uv pip sync --python "$RUNNER_TEMP/ci-tools/bin/python" --require-hashes scripts/ci-requirements.txt
      - name: Check dependency and workflow locks
        run: >-
          "$RUNNER_TEMP/ci-tools/bin/python" -m pytest -q scripts/tests/test_dependency_workflow_locks.py
      - name: Check catalog lock
        working-directory: catalog
        run: uv lock --check
      - name: Install frozen catalog dependencies
        working-directory: catalog
        run: uv sync --frozen --extra test
      - name: Test catalog without database cases
        working-directory: catalog
        run: uv run --frozen python -m pytest -q -m 'not db' tests
