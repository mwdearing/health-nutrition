name: Announce beta

# When a signed beta run finishes, posts the build, its version and the pull requests merged since the last upload
# to the pinned "TestFlight beta log" issue, and records the new last upload there. A failed build is posted too,
# so a scheduled build never fails silently. Runs from the default branch with a token that can only write issues;
# it executes nothing from the run it reports on and reads the run's name, version and commit as data only.
on:
  workflow_run:
    workflows: ["Signed beta upload"]
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: announce-beta
  cancel-in-progress: false

jobs:
  announce:
    name: Post the build to the beta log
    if: >-
      ${{ github.event.workflow_run.path == '.github/workflows/signed-beta.yml'
      && github.event.workflow_run.event == 'workflow_dispatch'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Post the build and update the last upload
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: python3 .github/scripts/beta_state.py announce
