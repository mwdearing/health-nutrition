name: docs-consistency

# The MVP-GAPS traceability document states its verdicts twice — as a table row
# per area and as a summary of counts — and three separate reviews found the two
# disagreeing, because nothing compared them. This workflow runs the comparison,
# so a table/summary inconsistency cannot merge unnoticed.
#
# It also checks that every path the document cites as evidence still exists, so
# the trigger has to cover the cited source trees as well as the document: a PR
# that deletes or renames a cited evidence file under ios/** must run the
# citation checks, not slip past them.

on:
  pull_request:
    paths:
      - "docs/mvp-gaps-traceability.md"
      - "scripts/tests/test_mvp_gaps_traceability.py"
      - "scripts/ci-requirements.in"
      - "scripts/ci-requirements.txt"
      - ".github/workflows/docs-consistency.yml"
      - "ios/**"
      # The absence assertion is repository-wide (a `Settings.swift` anywhere in
      # the tree would falsify the document), so a PR that adds one outside ios/
      # has to run these checks too, or the claim can go stale unnoticed.
      - "**/Settings.swift"
  push:
    branches: [main]
    paths:
      - "docs/mvp-gaps-traceability.md"
      - "scripts/tests/test_mvp_gaps_traceability.py"
      - "scripts/ci-requirements.in"
      - "scripts/ci-requirements.txt"
      - ".github/workflows/docs-consistency.yml"
      - "ios/**"
      - "**/Settings.swift"

permissions:
  contents: read

jobs:
  traceability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.12.19
          enable-cache: false
      - name: Install hash-locked CI tools
        run: uv pip sync --python "$(python -c 'import sys; print(sys.executable)')" --require-hashes scripts/ci-requirements.txt
      - name: Check the traceability document is internally consistent
        run: python -m pytest -q -p no:cacheprovider scripts/tests/test_mvp_gaps_traceability.py
