name: ios

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

jobs:
  swift-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Test NutritionCore
        working-directory: ios/NutritionCore
        run: swift test
