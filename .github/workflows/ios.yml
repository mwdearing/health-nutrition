name: ios

on:
  pull_request:
    paths:
      - "ios/**"
      - "scripts/check_privacy_manifest.py"
      - "scripts/tests/test_check_privacy_manifest.py"
      - ".github/workflows/ios.yml"
      - ".github/workflows/signed-beta.yml"
      - "scripts/tests/test_signed_beta_workflow.py"
      - "scripts/tests/test_project_declarations.py"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "scripts/check_privacy_manifest.py"
      - "scripts/tests/test_check_privacy_manifest.py"
      - ".github/workflows/ios.yml"
      - ".github/workflows/signed-beta.yml"
      - "scripts/tests/test_signed_beta_workflow.py"
      - "scripts/tests/test_project_declarations.py"
  # Manual runs only. Builds an unsigned device .ipa so it can be signed and sideloaded locally;
  # no signing material ever lives in this repository.
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Bundle identifier to build with"
        required: false
        default: dev.example.HealthNutrition
        type: string
      configuration:
        description: "Build configuration"
        required: false
        default: Release
        type: choice
        options: [Release, Debug]
      marketing_version:
        description: "Marketing version (empty uses 0.1.<run number>)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  privacy-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install pytest pyyaml
      - name: Check the privacy manifest against the Swift sources
        run: python scripts/check_privacy_manifest.py
      - name: Test the privacy manifest check
        run: python -m pytest -q -p no:cacheprovider scripts/tests/test_check_privacy_manifest.py
      # The signed-upload workflow is manual-only and reviewer-gated; these tests pin that shape.
      - name: Test the signed-upload workflow guardrails
        run: python -m pytest -q -p no:cacheprovider scripts/tests/test_signed_beta_workflow.py
      - name: Test the project declarations
        run: python -m pytest -q -p no:cacheprovider scripts/tests/test_project_declarations.py

  swift-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Test NutritionCore
        working-directory: ios/NutritionCore
        run: swift test

  app-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: ios/HealthNutrition
        run: xcodegen generate
      - name: Build the app for the iOS Simulator
        working-directory: ios/HealthNutrition
        run: xcodebuild -project HealthNutrition.xcodeproj -scheme HealthNutrition -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  # The app target's own unit tests. Same shape as app-build: regenerate the project, then run the
  # HealthNutritionTests bundle, which is hosted by the app so @testable import HealthNutrition works.
  app-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: ios/HealthNutrition
        run: xcodegen generate
      # The simulator is picked from what this runner actually has, never a name that might not exist:
      # GitHub adds and retires runtimes, so a hard-coded iPhone would start failing on its own.
      - name: Pick an available iPhone simulator
        id: simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          name=$(python3 - "$RUNNER_TEMP/simulators.json" <<'PY'
          import json
          import sys

          devices = json.load(open(sys.argv[1]))["devices"]
          names = [
              device["name"]
              for runtime in sorted(devices)
              for device in devices[runtime]
              if device.get("isAvailable") and device["name"].startswith("iPhone")
          ]
          print(names[0] if names else "")
          PY
          )
          if [ -z "$name" ]; then
            echo "No available iPhone simulator on this runner." >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using simulator: $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Test the app target on the simulator
        working-directory: ios/HealthNutrition
        env:
          SIMULATOR: ${{ steps.simulator.outputs.name }}
        run: xcodebuild -project HealthNutrition.xcodeproj -scheme HealthNutrition -destination "platform=iOS Simulator,name=$SIMULATOR" CODE_SIGNING_ALLOWED=NO test

  # Manual only: an unsigned device build, for whoever runs it to sign with their own identity and sideload.
  unsigned-ipa:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: ios/HealthNutrition
        run: xcodegen generate
      - name: Build the unsigned device app
        working-directory: ios/HealthNutrition
        env:
          BUNDLE_ID: ${{ inputs.bundle_id }}
          CONFIGURATION: ${{ inputs.configuration }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: |
          xcodebuild -project HealthNutrition.xcodeproj -target HealthNutrition -sdk iphoneos -configuration "$CONFIGURATION" SYMROOT="$RUNNER_TEMP/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" MARKETING_VERSION="${MARKETING_VERSION:-0.1.$GITHUB_RUN_NUMBER}" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" build
      - name: Package the unsigned ipa
        run: |
          app=$(find "$RUNNER_TEMP/build" -type d -name HealthNutrition.app -path '*iphoneos*' -print -quit)
          if [ -z "$app" ]; then
            echo "No HealthNutrition.app found under $RUNNER_TEMP/build" >&2
            find "$RUNNER_TEMP/build" -maxdepth 3 >&2
            exit 1
          fi
          echo "Found $app"
          mkdir -p "$RUNNER_TEMP/ipa"
          cd "$RUNNER_TEMP/ipa"
          mkdir -p Payload
          cp -R "$app" Payload/
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "Payload/HealthNutrition.app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "Payload/HealthNutrition.app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "Payload/HealthNutrition.app/Info.plist"
          zip -qry HealthNutrition-unsigned.ipa Payload
          shasum -a 256 HealthNutrition-unsigned.ipa > HealthNutrition-unsigned.ipa.sha256
          cat HealthNutrition-unsigned.ipa.sha256
          ls -l HealthNutrition-unsigned.ipa HealthNutrition-unsigned.ipa.sha256
      - name: Upload the unsigned ipa
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: HealthNutrition-unsigned-ipa
          path: |
            ${{ runner.temp }}/ipa/HealthNutrition-unsigned.ipa
            ${{ runner.temp }}/ipa/HealthNutrition-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
