name: Signed beta upload

# Manual only. Generates the Xcode project, archives with automatic signing and an App Store Connect API key,
# and uploads the build to App Store Connect for INTERNAL beta testing. The key, its ids and the team id live
# only in the protected `testflight` GitHub Environment (a reviewer approves each run) and are read only by
# the steps that need them. The bundle id is ALSO an environment secret (not an input), because a public repository
# shows workflow inputs and step environments in its logs; secrets are masked. The job runs only from `main`, and the
# environment must be restricted to the `main` branch in the repository settings. This workflow never runs on a pull
# request, never uploads an artifact, keeps xcodebuild output out of the public log and always removes the key file.

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: Marketing version to stamp (three parts, like 0.1.0); empty = the MARKETING_VERSION in ios/HealthNutrition/project.yml (the build number is run number + 100)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: signed-beta
  cancel-in-progress: false

jobs:
  signed-beta:
    name: Signed archive and upload
    runs-on: macos-26
    environment: testflight
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios/HealthNutrition
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      # XcodeGen is installed by the shared pinned release bootstrap and verified by checksum before it runs;
      # anything it puts into the project would run later in this job, which holds the signing key.
      - name: Install XcodeGen (pinned release, checksum verified)
        run: bash "$GITHUB_WORKSPACE/.github/scripts/install-xcodegen.sh"

      - name: Generate the Xcode project
        run: '"$RUNNER_TEMP/xcodegen-dist/xcodegen/bin/xcodegen" generate'

      - name: Verify generated account and HealthKit entitlements
        run: |
          python3 - <<'PY'
          import plistlib
          with open("HealthNutrition.entitlements", "rb") as handle:
              entitlements = plistlib.load(handle)
          assert entitlements.get("com.apple.developer.applesignin") == ["Default"]
          assert entitlements.get("com.apple.developer.healthkit") is True
          PY

      - name: Check the signing secrets and write the key file
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          HCAPTCHA_SITE_KEY: ${{ secrets.HCAPTCHA_SITE_KEY }}
          USDA_FDC_API_KEY: ${{ secrets.USDA_FDC_API_KEY }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          # The hosted project asks for a challenge on every emailed-code request, so account settings without a
          # site key would fail every email sign-in. Remove this rule only if the hosted check is turned off.
          if [[ -n "$SUPABASE_URL" && -z "$HCAPTCHA_SITE_KEY" ]]; then
            fail "the account settings need HCAPTCHA_SITE_KEY while the hosted sign-in check is on"
          fi
          # The account settings are both set or both empty. Naming the values in the message would print them,
          # so the message only says which rule failed.
          if [[ -n "$SUPABASE_URL" || -n "$SUPABASE_ANON_KEY" ]]; then
            [[ -n "$SUPABASE_URL" && -n "$SUPABASE_ANON_KEY" ]] || fail "the account settings need both SUPABASE_URL and SUPABASE_ANON_KEY, or neither"
          fi
          [[ "$BUNDLE_ID" =~ ^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$ ]] || fail "bundle_id has characters a bundle identifier cannot have"
          [[ -z "$MARKETING_VERSION" || "$MARKETING_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "marketing_version must have three parts, like 1.2.3"
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || fail "APPLE_TEAM_ID is not 10 letters or digits"
          [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]] || fail "ASC_KEY_ID is not 10 letters or digits"
          [[ "$ASC_ISSUER_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] || fail "ASC_ISSUER_ID is not a UUID"
          [[ "$ASC_KEY_P8" == *"BEGIN PRIVATE KEY"* ]] || fail "ASC_KEY_P8 is not a PEM private key"
          [[ "$ASC_KEY_P8" == *"END PRIVATE KEY"* ]] || fail "ASC_KEY_P8 is cut short: no END line"
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"

      # A fresh runner holds no signing identity, so automatic signing would create a new development
      # certificate on every run, and the team reaches Apple's certificate limit after a handful of runs.
      # One stored development certificate is imported instead, into a keychain that exists only for this
      # run; the archive reuses it. The upload is still signed for distribution by App Store Connect.
      - name: Import the stored signing certificate into a temporary keychain
        env:
          SIGNING_CERT_P12_BASE64: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [[ -n "$SIGNING_CERT_P12_BASE64" ]] || fail "SIGNING_CERT_P12_BASE64 is not set in the environment"
          [[ -n "$SIGNING_CERT_PASSWORD" ]] || fail "SIGNING_CERT_PASSWORD is not set in the environment"
          umask 077
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          printf '%s' "$SIGNING_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12" || fail "SIGNING_CERT_P12_BASE64 is not base64"
          # A bundle written by OpenSSL 3 uses AES and a SHA-256 MAC, which the keychain import refuses with the
          # same message as a wrong password. Prove the password first, then re-wrap the bundle with the older
          # algorithms. The unwrapped copy is private to this user (umask 077) and removed in the same line.
          /usr/bin/openssl pkcs12 -in "$RUNNER_TEMP/signing.p12" -passin env:SIGNING_CERT_PASSWORD -noout > /dev/null 2>&1 || fail "SIGNING_CERT_PASSWORD does not open the stored certificate file"
          rewrap() { /usr/bin/openssl pkcs12 -in "$RUNNER_TEMP/signing.p12" -passin env:SIGNING_CERT_PASSWORD -nodes -out "$RUNNER_TEMP/signing.pem" > /dev/null 2>&1 && /usr/bin/openssl pkcs12 -export -in "$RUNNER_TEMP/signing.pem" -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 -passout env:SIGNING_CERT_PASSWORD -out "$RUNNER_TEMP/signing-keychain.p12" > /dev/null 2>&1; }
          rewrap || { rm -f "$RUNNER_TEMP/signing.pem"; fail "the stored certificate file could not be re-wrapped for the keychain"; }
          rm -f "$RUNNER_TEMP/signing.pem"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null 2>&1 || fail "the temporary keychain could not be created"
          security set-keychain-settings -lut 21600 "$KEYCHAIN" > /dev/null 2>&1
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null 2>&1
          security import "$RUNNER_TEMP/signing-keychain.p12" -k "$KEYCHAIN" -P "$SIGNING_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security > /dev/null 2>&1 || fail "the keychain refused the stored certificate"
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/signing-keychain.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null 2>&1 || fail "the imported key could not be opened to codesign"
          # Put the keychain first in the search list, keeping the runner's own after it.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"') > /dev/null 2>&1
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Apple Development" || fail "the stored certificate is not a valid Apple Development identity with its private key"
          # An identity of another team would pass the check above, and Xcode would create a new certificate
          # for this team on every run after all. The certificate's organizational unit is its team.
          security find-certificate -c "Apple Development" -p "$KEYCHAIN" 2> /dev/null | openssl x509 -noout -subject 2> /dev/null | grep -q "OU *= *$APPLE_TEAM_ID\b" || fail "the stored certificate was not issued to this team"

      - name: Archive with automatic signing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          HCAPTCHA_SITE_KEY: ${{ secrets.HCAPTCHA_SITE_KEY }}
          USDA_FDC_API_KEY: ${{ secrets.USDA_FDC_API_KEY }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: |
          set -euo pipefail
          quiet() {
            local name="$1" log="$2"; shift 2
            if ! "$@" > "$log" 2>&1; then
              # The log is never printed: this repository's Actions log is public. Only a fixed category message
              # is printed, chosen by searching the file's error lines, so nothing from the file can reach the log.
              # Only lines xcodebuild marks as errors are searched: the rest of the log echoes the command line,
              # whose words (team, version, authentication) would make every category fire.
              echo "::error::$name failed. The xcodebuild output is not published."
              errors() { grep -iE '(^|: )error: |\*\* .* FAILED' "$log" || true; }
              errors | grep -qiE 'unable to authenticate|authentication|401|403' && echo "::error::  category: the App Store Connect key was rejected"
              errors | grep -qiE 'no signing certificate|no certificate|certificate' && echo "::error::  category: a signing certificate problem"
              errors | grep -qiE "doesn't include|doesn't match|no profiles for|provisioning profile" && echo "::error::  category: a provisioning profile or App ID capability mismatch"
              errors | grep -qiE 'entitlement|capabilit' && echo "::error::  category: an entitlement or capability mismatch"
              errors | grep -qiE 'no account|team' && echo "::error::  category: a team or account problem"
              errors | grep -qiE 'bundle identifier|bundle id' && echo "::error::  category: a bundle identifier problem"
              errors | grep -qiE 'build number|version' && echo "::error::  category: a version or build number problem"
              errors | grep -qiE 'error:' && echo "::error::  category: a compile or build error"
              exit 1
            fi
          }
          if [[ -z "$MARKETING_VERSION" ]]; then
            MARKETING_VERSION=$(python3 -c "import re; print(re.search(r'^\s*MARKETING_VERSION:\s*\"?([0-9.]+)', open('project.yml').read(), re.M).group(1))")
          fi
          BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 100))
          echo "Stamping version $MARKETING_VERSION build $BUILD_NUMBER"
          quiet Archive "$RUNNER_TEMP/archive.log" xcodebuild archive \
            -project HealthNutrition.xcodeproj \
            -scheme HealthNutrition \
            -disableAutomaticPackageResolution \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HealthNutrition.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            "DEVELOPMENT_TEAM=$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            "APP_BUNDLE_ID=$BUNDLE_ID" \
            "MARKETING_VERSION=$MARKETING_VERSION" \
            "CURRENT_PROJECT_VERSION=$BUILD_NUMBER" \
            "SUPABASE_URL=${SUPABASE_URL:-}" \
            "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}" \
            "HCAPTCHA_SITE_KEY=${HCAPTCHA_SITE_KEY:-}" \
            "USDA_FDC_API_KEY=${USDA_FDC_API_KEY:-}"

      # Fails the build when the widget extension did not reach the archive or is built or signed wrong, so it is
      # caught here and not on a phone. The bundle identifier is a secret in this public repository: every check
      # compares in the shell and prints only OK or FAIL, key names, the extension point and OS floors.
      - name: Check the archive embeds the widget and Watch extensions
        env:
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
        run: |
          set -euo pipefail
          pb=/usr/libexec/PlistBuddy
          app=$(ls -d "$RUNNER_TEMP"/HealthNutrition.xcarchive/Products/Applications/*.app 2>/dev/null | head -n 1 || true)
          if [ -z "$app" ]; then
            echo "::error::The archive has no app under Products/Applications."
            exit 1
          fi
          appex="$app/PlugIns/HealthNutritionWidgets.appex"
          group="group.$BUNDLE_ID"
          fail=0
          check() { # check <label> <command...>: prints OK or FAIL, never a value
            local label="$1"; shift
            if "$@" >/dev/null 2>&1; then echo "OK    $label"; else echo "FAIL  $label"; fail=1; fi
          }
          echo "Embedded extensions:"
          ls "$app/PlugIns" 2>/dev/null || true
          if [ ! -d "$appex" ]; then
            echo "FAIL  PlugIns/HealthNutritionWidgets.appex is present"
            echo "::error::The archive has no PlugIns/HealthNutritionWidgets.appex."
            exit 1
          fi
          echo "OK    PlugIns/HealthNutritionWidgets.appex is present"
          trap 'rm -f "$RUNNER_TEMP"/*.entitlements.plist "$RUNNER_TEMP"/*.profile.plist' EXIT
          field() { "$pb" -c "Print :$2" "$1/Info.plist" 2>/dev/null || true; }
          eq() { [ -n "$1" ] && [ "$1" = "$2" ]; } # an empty value never counts as a match
          check "extension bundle id is the app's id plus .widgets" eq "$(field "$appex" CFBundleIdentifier)" "$BUNDLE_ID.widgets"
          check "app bundle id is the configured id" eq "$(field "$app" CFBundleIdentifier)" "$BUNDLE_ID"
          point=$(field "$appex" NSExtension:NSExtensionPointIdentifier)
          echo "Extension point: $point"
          check "extension point is com.apple.widgetkit-extension" eq "$point" "com.apple.widgetkit-extension"
          check "extension version matches the app" eq "$(field "$appex" CFBundleShortVersionString)" "$(field "$app" CFBundleShortVersionString)"
          check "extension build number matches the app" eq "$(field "$appex" CFBundleVersion)" "$(field "$app" CFBundleVersion)"
          echo "Extension OS floor: $(field "$appex" MinimumOSVersion)"
          echo "App OS floor: $(field "$app" MinimumOSVersion)"
          group_key="com.apple.security.application-groups"
          check_signing() { # check_signing <bundle path>: the App Group entitlement and the embedded profile
            local target="$1" name ent profile prof
            name=$(basename "$target")
            ent="$RUNNER_TEMP/$name.entitlements.plist"
            codesign -d --entitlements :- "$target" > "$ent" 2>/dev/null || true
            check "$name carries the $group_key key" "$pb" -c "Print :$group_key" "$ent"
            check "$name's first App Group is the app's group" eq "$("$pb" -c "Print :$group_key:0" "$ent" 2>/dev/null || true)" "$group"
            # A second group is a line starting with "group." on either stream; a not-found message never is.
            if "$pb" -c "Print :$group_key:1" "$ent" 2>&1 | grep -q '^group\.'; then
              echo "FAIL  $name lists exactly one App Group"; fail=1
            else
              echo "OK    $name lists exactly one App Group"
            fi
            profile="$target/embedded.mobileprovision"
            if [ -f "$profile" ]; then
              echo "OK    $name has an embedded provisioning profile"
              prof="$RUNNER_TEMP/$name.profile.plist"
              security cms -D -i "$profile" > "$prof" 2>/dev/null || true
              check "$name's profile grants the app's group" eq "$("$pb" -c "Print :Entitlements:$group_key:0" "$prof" 2>/dev/null || true)" "$group"
            else
              echo "FAIL  $name has an embedded provisioning profile"; fail=1
            fi
          }
          check_signing "$app"
          check_signing "$appex"

          # The Watch app, when the archive has one: it sits under Watch/ in the app, with its own widget extension.
          # Whether the archive must have one is read from the checked-out project, so a dropped embed fails the run.
          # Any mention of the Watch target, or any watchOS target at all, counts, so neither a changed way of writing
          # the dependency nor a renamed target can silence this.
          if [ ! -f project.yml ]; then
            echo "::error::project.yml is not where this step expects it."
            exit 1
          fi
          expect_watch=0
          if grep -q 'HealthNutritionWatch' project.yml || grep -qiE '^[[:space:]]*platform:[[:space:]]*watchOS' project.yml; then expect_watch=1; fi
          watch_count=$(ls -d "$app"/Watch/*.app 2>/dev/null | wc -l | tr -d ' ' || true)
          if [ "$watch_count" -eq 0 ] && [ "$expect_watch" -eq 0 ]; then
            echo "NOTE  this project does not embed a Watch app; the Watch checks are skipped"
          elif [ "$watch_count" -eq 0 ]; then
            echo "FAIL  the archive has a Watch app, as the project embeds one"; fail=1
          else
            check "the archive has exactly one Watch app" eq "$watch_count" "1"
            watch=$(ls -d "$app"/Watch/*.app | head -n 1)
            watchex="$watch/PlugIns/HealthNutritionWatchWidgets.appex"
            echo "Watch apps:"
            ls "$app/Watch"
            check "the Watch app is HealthNutritionWatch.app" eq "$(basename "$watch")" "HealthNutritionWatch.app"
            if [ ! -d "$watchex" ]; then
              echo "FAIL  the Watch app embeds PlugIns/HealthNutritionWatchWidgets.appex"; fail=1
            else
              echo "OK    the Watch app embeds PlugIns/HealthNutritionWatchWidgets.appex"
              check "Watch app bundle id is the app's id plus .watchkitapp" eq "$(field "$watch" CFBundleIdentifier)" "$BUNDLE_ID.watchkitapp"
              check "Watch app names the iPhone app as its companion" eq "$(field "$watch" WKCompanionAppBundleIdentifier)" "$BUNDLE_ID"
              check "Watch widget bundle id is the app's id plus .watchkitapp.widgets" eq "$(field "$watchex" CFBundleIdentifier)" "$BUNDLE_ID.watchkitapp.widgets"
              wpoint=$(field "$watchex" NSExtension:NSExtensionPointIdentifier)
              echo "Watch extension point: $wpoint"
              check "Watch extension point is com.apple.widgetkit-extension" eq "$wpoint" "com.apple.widgetkit-extension"
              check "Watch app version matches the iPhone app" eq "$(field "$watch" CFBundleShortVersionString)" "$(field "$app" CFBundleShortVersionString)"
              check "Watch app build number matches the iPhone app" eq "$(field "$watch" CFBundleVersion)" "$(field "$app" CFBundleVersion)"
              check "Watch widget version matches the iPhone app" eq "$(field "$watchex" CFBundleShortVersionString)" "$(field "$app" CFBundleShortVersionString)"
              check "Watch widget build number matches the iPhone app" eq "$(field "$watchex" CFBundleVersion)" "$(field "$app" CFBundleVersion)"
              echo "Watch app OS floor: $(field "$watch" MinimumOSVersion)"
              check_signing "$watch"
              check_signing "$watchex"
            fi
          fi
          if [ "$fail" -ne 0 ]; then
            echo "::error::The archive's widget and Watch extension check failed; see the FAIL lines above."
          fi
          exit "$fail"

      - name: Export and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          quiet() {
            local name="$1" log="$2"; shift 2
            if ! "$@" > "$log" 2>&1; then
              # Same rule as the archive step: the log stays on the runner, only fixed categories are printed.
              echo "::error::$name failed. The xcodebuild output is not published."
              errors() { grep -iE '(^|: )error: |\*\* .* FAILED' "$log" || true; }
              errors | grep -qiE 'unable to authenticate|authentication|401|403' && echo "::error::  category: the App Store Connect key was rejected"
              errors | grep -qiE 'no signing certificate|no certificate|certificate' && echo "::error::  category: a signing certificate problem"
              errors | grep -qiE "doesn't include|doesn't match|no profiles for|provisioning profile" && echo "::error::  category: a provisioning profile or App ID capability mismatch"
              errors | grep -qiE 'entitlement|capabilit' && echo "::error::  category: an entitlement or capability mismatch"
              errors | grep -qiE 'no account|team' && echo "::error::  category: a team or account problem"
              errors | grep -qiE 'bundle identifier|bundle id' && echo "::error::  category: a bundle identifier problem"
              errors | grep -qiE 'build number|version' && echo "::error::  category: a version or build number problem"
              errors | grep -qiE 'error:' && echo "::error::  category: an export or upload error"
              exit 1
            fi
          }
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>testFlightInternalTestingOnly</key>
            <false/>
          </dict>
          </plist>
          PLIST
          quiet Export "$RUNNER_TEMP/export.log" xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/HealthNutrition.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove the key file and the temporary keychain
        if: ${{ always() }}
        run: |
          rm -f "$RUNNER_TEMP/asc/AuthKey.p8" "$RUNNER_TEMP/ExportOptions.plist" "$RUNNER_TEMP/archive.log" "$RUNNER_TEMP/export.log" "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/signing-keychain.p12" "$RUNNER_TEMP/signing.pem"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" > /dev/null 2>&1 || true
