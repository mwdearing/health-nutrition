name: design-system-tests

on:
  pull_request:
    paths:
      - "ios/**"
      - "scripts/build_design_system.py"
      - "scripts/tests/test_build_design_system.py"
      - ".github/workflows/design-system-tests.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "scripts/build_design_system.py"
      - "scripts/tests/test_build_design_system.py"
      - ".github/workflows/design-system-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install pytest
      - name: Test the design-system generator
        run: python -m pytest -q -p no:cacheprovider scripts/tests/test_build_design_system.py
      - name: Check the generator against the repository's Swift sources
        run: python scripts/build_design_system.py "$RUNNER_TEMP/design-system" --no-index --check
