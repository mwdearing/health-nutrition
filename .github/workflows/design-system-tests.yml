name: design-system-tests

on:
  pull_request:
    paths:
      - "ios/**"
      - "scripts/build_design_system.py"
      - "scripts/tests/test_build_design_system.py"
      - "scripts/ci-requirements.in"
      - "scripts/ci-requirements.txt"
      - ".github/workflows/design-system-tests.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "scripts/build_design_system.py"
      - "scripts/tests/test_build_design_system.py"
      - "scripts/ci-requirements.in"
      - "scripts/ci-requirements.txt"
      - ".github/workflows/design-system-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.12.19
          enable-cache: false
      - name: Install hash-locked CI tools
        run: uv pip sync --python "$(python -c 'import sys; print(sys.executable)')" --require-hashes scripts/ci-requirements.txt
      - name: Test the design-system generator
        run: python -m pytest -q -p no:cacheprovider scripts/tests/test_build_design_system.py
      - name: Check the generator against the repository's Swift sources
        run: python scripts/build_design_system.py "$RUNNER_TEMP/design-system" --no-index --check
