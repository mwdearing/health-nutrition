name: swift-lint

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/scripts/attribution_check.py"
      - ".github/workflows/attribution-check.yml"
      - ".github/workflows/ios.yml"
      - ".github/workflows/screenshots.yml"
      - ".github/workflows/signed-beta.yml"
      - ".github/scripts/install-xcodegen.sh"
      - "scripts/lint_swift_sources.py"
      - "scripts/tests/test_attribution_check.py"
      - "scripts/tests/test_ios_workflow.py"
      - "scripts/tests/test_lint_swift_sources.py"
      - "scripts/tests/test_dependency_workflow_locks.py"
      - "scripts/ci-requirements.in"
      - "scripts/ci-requirements.txt"
      - ".github/workflows/swift-lint.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/scripts/attribution_check.py"
      - ".github/workflows/attribution-check.yml"
      - ".github/workflows/ios.yml"
      - ".github/workflows/screenshots.yml"
      - ".github/workflows/signed-beta.yml"
      - ".github/scripts/install-xcodegen.sh"
      - "scripts/lint_swift_sources.py"
      - "scripts/tests/test_attribution_check.py"
      - "scripts/tests/test_ios_workflow.py"
      - "scripts/tests/test_lint_swift_sources.py"
      - "scripts/tests/test_dependency_workflow_locks.py"
      - "scripts/ci-requirements.in"
      - "scripts/ci-requirements.txt"
      - ".github/workflows/swift-lint.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.12.19
          enable-cache: false
      - name: Install hash-locked CI tools
        run: uv pip sync --python "$(python -c 'import sys; print(sys.executable)')" --require-hashes scripts/ci-requirements.txt
      - name: Lint Swift sources
        run: python scripts/lint_swift_sources.py ios/NutritionCore
      - name: Lint the app target (ios/HealthNutrition)
        run: python scripts/lint_swift_sources.py ios/HealthNutrition
      - name: Test the lint
        run: python -m pytest -q -p no:cacheprovider scripts/tests/test_lint_swift_sources.py scripts/tests/test_attribution_check.py scripts/tests/test_ios_workflow.py scripts/tests/test_dependency_workflow_locks.py
