name: swift-lint

on:
  pull_request:
    paths:
      - "ios/**"
      - "scripts/lint_swift_sources.py"
      - "scripts/tests/test_lint_swift_sources.py"
      - ".github/workflows/swift-lint.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "scripts/lint_swift_sources.py"
      - "scripts/tests/test_lint_swift_sources.py"
      - ".github/workflows/swift-lint.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install pytest
      - name: Lint Swift sources
        run: python scripts/lint_swift_sources.py ios/NutritionCore
      - name: Test the lint
        run: python -m pytest -q -p no:cacheprovider scripts/tests/test_lint_swift_sources.py